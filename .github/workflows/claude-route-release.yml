name: Claude Route signed release

on:
  push:
    tags: ['v*-claude-route']
  workflow_dispatch:
    inputs:
      version:
        description: Version from tauri.conf.json (without v)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Verify version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then RELEASE_VERSION="${GITHUB_REF_NAME#v}"; RELEASE_VERSION="${RELEASE_VERSION%-claude-route}"; export RELEASE_VERSION; fi
          node -e 'const v=process.env.RELEASE_VERSION; if (!/^\d+\.\d+\.\d+$/.test(v) || require("./src-tauri/tauri.conf.json").version !== v || require("./package.json").version !== v) process.exit(1)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prebuild ${{ matrix.target }}
      - name: Build signed bundles
        run: pnpm exec tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CLAUDE_ROUTE_UPDATER_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true
      - name: Publish complete release and update feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; VERSION="${VERSION%-claude-route}"; export VERSION; fi
          mapfile -t files < <(find bundles -type f)
          exe=$(find bundles -type f -name '*.exe' -print -quit)
          mac=$(find bundles -type f -name '*.app.tar.gz' -print -quit)
          dmg=$(find bundles -type f -name '*.dmg' -print -quit)
          test -n "$exe" && test -f "$exe.sig" && test -n "$mac" && test -f "$mac.sig" && test -n "$dmg"
          tag="v${VERSION}-claude-route"
          gh release create "$tag" --target "$SHA" --draft --prerelease --title "Claude Route $VERSION beta" --notes "Claude Route $VERSION beta" "${files[@]}"
          gh release edit "$tag" --draft=false
          EXE="$exe" MAC="$mac" TAG="$tag" node <<'NODE'
          const fs = require('fs');
          const base = `https://github.com/${process.env.GH_REPO}/releases/download/${process.env.TAG}/`;
          const platform = path => ({ signature: fs.readFileSync(path + '.sig', 'utf8').trim(), url: base + encodeURIComponent(require('path').basename(path)) });
          fs.writeFileSync('latest.json', JSON.stringify({version: process.env.VERSION, notes: `Claude Route ${process.env.VERSION}`, pub_date: new Date().toISOString(), platforms: {'windows-x86_64': platform(process.env.EXE), 'darwin-aarch64': platform(process.env.MAC)}}, null, 2));
          NODE
          if ! gh release view claude-route-updater >/dev/null 2>&1; then
            gh release create claude-route-updater --target "$SHA" --title 'Claude Route update channel' --notes 'Signed update metadata.' --prerelease
          fi
          gh release upload claude-route-updater latest.json --clobber
