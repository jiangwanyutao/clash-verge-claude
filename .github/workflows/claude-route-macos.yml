name: Claude Route macOS build

on:
  push:
    branches: [feat/macos-apple-silicon]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prebuild aarch64-apple-darwin
      - run: pnpm exec tauri build --target aarch64-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Claude-Route-macOS-Apple-Silicon
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
